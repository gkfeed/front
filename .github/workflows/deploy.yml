name: Deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Build and smoke test production image
        run: |
          docker build --tag gkfeed-front:ci .
          container_id="$(docker run --detach --publish 127.0.0.1::3000 gkfeed-front:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          published_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort}}' "$container_id")"

          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:$published_port/" >/dev/null; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_id" | grep --quiet true; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

          docker logs "$container_id"
          exit 1
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy with SSH
        uses: fifsky/ssh-action@5a841de87115730aff750ac127773e3b2b3f56dd
        with:
          command: |
            cd github/gkfeed/front
            make update
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER_NAME }}
          key: ${{ secrets.PRIVATE_KEY }}
