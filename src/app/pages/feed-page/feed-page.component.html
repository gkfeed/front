<section class="container" aria-labelledby="feed-page-title">
  <h1 id="feed-page-title" class="page-title">Feed source details</h1>

  @if (isLoading) {
    <p class="status" aria-live="polite">Loading feed source</p>
  } @else if (loadError) {
    <p class="status status--error" role="alert">{{ loadError }}</p>
  } @else if (feed) {
    <app-feed-card [feed]="feed" [asLink]="false"></app-feed-card>
    <div class="actions">
      <button type="button" (click)="deleteFeed()" class="delete" [disabled]="isDeleting">
        {{ isDeleting ? 'Deleting...' : 'Delete' }}
      </button>
      @if (deleteError) {
        <p class="status status--error" role="alert">{{ deleteError }}</p>
      } @else if (isDeleting) {
        <p class="status" aria-live="polite">Deleting feed source</p>
      }
    </div>
  }
</section>
