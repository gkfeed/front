<!doctype html>
<html lang="en" data-theme="dark" data-theme-preference="system">
<head>
  <meta charset="utf-8">
  <title>GKFEED</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211c1b">
  <script>
    (() => {
      let saved = null;
      try { saved = localStorage.getItem('gkfeed.theme'); } catch { /* Use system theme. */ }
      const preferences = ['system', 'system-catppuccin', 'light', 'dark', 'latte', 'mocha'];
      const preference = preferences.includes(saved) ? saved : 'system';
      const prefersLight = matchMedia('(prefers-color-scheme: light)').matches;
      const theme = preference === 'system'
        ? prefersLight ? 'light' : 'dark'
        : preference === 'system-catppuccin'
          ? prefersLight ? 'latte' : 'mocha'
          : preference;
      document.documentElement.dataset.themePreference = preference;
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
